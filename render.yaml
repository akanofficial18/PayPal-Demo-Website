services:
  - type: web
    name: paypal-ai-bills-expense-hub
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/paypal/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

